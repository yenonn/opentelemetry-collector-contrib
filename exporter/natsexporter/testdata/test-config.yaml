nats/all_fields:
  connection:
    endpoint: nats://localhost:4222
    auth:
      plain:
        username: user
        password: pass
    tls:
      ca_file: "/var/lib/myca.pem"
      insecure: true
    connection_timeout: 1ms

  topic:
    subject: foo.bar
  encoding_extension: otlp_encoding/rabbitmq123
  retry_on_failure:
    enabled: true

nats/mandatory_fields:
  connection:
    endpoint: nats://localhost:4222
    auth:
      plain:
        username: user
        password: pass

nats/missing_endpoint:
  connection:
    auth:
      plain:
        username: user
        password: pass

nats/missing_plainauth_username:
  connection:
    endpoint: nats://localhost:4222
    auth:
      plain:
        password: pass
